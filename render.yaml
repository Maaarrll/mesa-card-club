# Render Blueprint: Render reads this to create the web service.
# The free plan has no disk: accounts, coins and logins are kept in a free Upstash Redis database
# (the two UPSTASH_* values below). Without them, everything resets when the service sleeps.
services:
  - type: web
    name: mesa-card-club
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_KEY            # the /admin key; Render generates it, find it under Environment
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL     # from your Upstash database page (REST API section)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN   # same place; keep it secret
        sync: false
