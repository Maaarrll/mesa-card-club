<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5876">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mesa">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Mesa Card Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- Phones at a table must be held sideways; shown by CSS only in portrait. -->
  <div id="rotate" class="rotate" role="alertdialog" aria-label="Turn your phone sideways">
    <div class="rotate-phone" aria-hidden="true">📱</div>
    <h2>Turn your phone sideways</h2>
    <p>The table is made for landscape. Rotate your phone to keep playing.</p>
    <button class="primary" data-do="landscape">Go full screen</button>
    <button class="link" data-do="leave">Leave table</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
